services:
  # Single IPFS Node with public & private network access
  ipfs:
    build: ./ipfs
    container_name: ipfs
    networks:
      - app-net
    ports:
      - "5001:5001"   # IPFS API
      - "8080:8080"   # IPFS Gateway
      - "4001:4001"   # IPFS Swarm (required for public network)
    volumes:
      - ipfs_data:/data/ipfs   # Persist IPFS repository data
    # Increase resource limits to improve performance
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # FastAPI Server
  fastapi:
    build: ./fastapi
    container_name: fastapi-server
    depends_on:
      - ipfs
    networks:
      - app-net
    ports:
      - "8000:8000"   # FastAPI server port
    volumes:
      - data:/data/chunks   # Volume for data chunks
    environment:
      - LOCAL_IPFS_API=http://ipfs:5001
      - LOCAL_IPFS_GATEWAY=http://ipfs:8080
      - USE_PUBLIC_GATEWAYS=true
    # Add DNS configuration to use Google DNS
    dns:
      - 8.8.8.8
      - 8.8.4.4

networks:
  app-net:
    driver: bridge

volumes:
  data:
  ipfs_data: