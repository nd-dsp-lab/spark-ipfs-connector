# should be run on machine with public ip

services:
  # Spark Master Node
  spark-master:
    image: bitnami/spark:3.3.2
    container_name: spark-master
    network_mode: host
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=129.74.152.201
      - SPARK_PUBLIC_DNS=129.74.152.201
      - SPARK_LOCAL_IP=129.74.152.201
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no

  # FastAPI Driver Server (Spark Driver)
  fastapi:
    build: ./fastapi
    container_name: fastapi-driver
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://129.74.152.201:7077
    ports:
      - "8000:8000" # FastAPI server port
    volumes:
      - fastapi-temp:/data/chunk1
    networks:
      - app-net

  ipfs:
    build: ./ipfs    # Build custom Dockerfile for IPFS
    networks:
      - app-net
    container_name: ipfs-private
    ports:
      - "5002:5002"   # IPFS API for node1 (exposed to host for debugging, optional)
      - "8082:8081"   # IPFS Gateway for node1 (exposed to host, optional) - changed from 8081
      - "4002:4002"   # IPFS Swarm port for node1 (exposed to host for peer-to-peer communication)
    volumes:
      - ipfs_data:/data/ipfs   # Persist IPFS repository data

networks:
  app-net:
    driver: bridge
volumes:
  fastapi-temp:
  ipfs_data:
