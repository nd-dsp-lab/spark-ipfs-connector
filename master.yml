# should be run on machine with public ip

services:
  # FastAPI Driver Server (Spark Driver)
  fastapi:
    build: ./fastapi
    container_name: fastapi-driver
    network_mode: host
    environment:
      - SPARK_MASTER=spark://129.74.152.201:7077
    # ports:
    #   - "8000:8000" # FastAPI server port
    #   - "10025:10025" # Spark Blockmanager Port
    #   - "10026:10026" # Spark Driver-Blockmanager Port
    #   - "10027:10027" # Spark Driver-Executor Port
    volumes:
      - fastapi-temp:/data/chunks
    # networks:
    #   - app-net

  ipfs:
    build: ./ipfs    # Build custom Dockerfile for IPFS
    networks:
      - app-net
    container_name: ipfs-private
    ports:
      - "5002:5002"   # IPFS API for node1 (exposed to host for debugging, optional)
      - "8082:8082"   # IPFS Gateway for node1 (exposed to host, optional) - changed from 8081
      # - "8083:8083"   # IPFS Websocket
      - "4002:4002"   # IPFS Swarm port for node1 (exposed to host for peer-to-peer communication)
    volumes:
      - ipfs_data:/data/ipfs   # Persist IPFS repository data
    # Increase resource limits to improve performance
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

networks:
  app-net:
    driver: bridge
volumes:
  fastapi-temp:
  ipfs_data:
