# should be run on machine with public ip

services:
  # Spark Master Node
  spark-master:
    image: bitnami/spark:3.3.2
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=129.74.152.201
      - SPARK_PUBLIC_DNS=129.74.152.201
      - SPARK_LOCAL_IP=129.74.152.201
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8080:8080" # Spark master web UI
      - "7077:7077" # Spark master service port
    networks:
      - app-net

  # FastAPI Driver Server (Spark Driver)
  fastapi:
    build: ./fastapi
    container_name: fastapi-driver
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://129.74.152.201:7077
    ports:
      - "8000:8000" # FastAPI server port
    volumes:
      - fastapi-temp:/data/chunk1
    networks:
      - app-net
networks:
  app-net:
    driver: host
volumes:
  fastapi-temp:
